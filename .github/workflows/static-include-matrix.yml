name: "Static Matrix Masterclass (Include, Exclude & Custom Objects)"

# Comprehensive Matrix Strategies Guide:
# Job 1: Multi-Dimensional Matrix with Exclude & Both types of Include (New Combo + Attribute Injection)
# Job 2: Pure "Include-Only" Matrix for Heterogeneous Microservices

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # =========================================================================
  # JOB 1: Base Dimensions + Exclude + Include (Case A & Case B)
  # =========================================================================
  multi-dimension-matrix:
    name: "Job1 [${{ matrix.os }} | Py ${{ matrix.python-version }} | Flag: ${{ matrix.flag || 'standard' }}]"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Base Dimensions: 2 OS x 2 Versions = 4 Base Combinations
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

        # 1. EXCLUDE: Prunes unwanted/unsupported combinations
        exclude:
          - os: windows-latest
            python-version: "3.11" # Removes Windows + 3.11 combination

        # 2. INCLUDE:
        include:
          # Case A: Adds a BRAND NEW combination that wasn't in the base matrix!
          - os: macos-latest
            python-version: "3.12"
            flag: "apple-silicon-build"

          # Case B: Injects an EXTRA VARIABLE into an EXISTING combination (ubuntu + 3.12)
          - os: ubuntu-latest
            python-version: "3.12"
            flag: "bleeding-edge-experimental"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Display Combination Diagnostics
        shell: bash
        run: |
          echo "=========================================================="
          echo "Operating System       : ${{ matrix.os }}"
          echo "Python Version         : ${{ matrix.python-version }}"
          echo "Injected Flag Variable : ${{ matrix.flag || 'None (Standard)' }}"
          echo "=========================================================="

  # =========================================================================
  # JOB 2: Pure "Include-Only" Matrix (List of Custom Heterogeneous Objects)
  # =========================================================================
  include-only-services-matrix:
    name: "Job2 [${{ matrix.service }} | Port ${{ matrix.port }} | Env ${{ matrix.environment }}]"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Each '-' is an explicit, independent standalone Job/Combination
        include:
          - service: "payment-service"
            port: 8080
            tier: "pci-dss"
            environment: "production"
            enable-monitoring: true

          - service: "auth-service"
            port: 8081
            tier: "critical"
            environment: "production"
            enable-monitoring: true

          - service: "ticket-service"
            port: 8082
            tier: "standard"
            environment: "staging"
            enable-monitoring: false

          - service: "notification-service"
            port: 8083
            tier: "low"
            environment: "development"
            enable-monitoring: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Process Microservice Object
        run: |
          echo "=========================================================="
          echo "Processing Service : ${{ matrix.service }}"
          echo "Network Port       : ${{ matrix.port }}"
          echo "Compliance Tier    : ${{ matrix.tier }}"
          echo "Environment        : ${{ matrix.environment }}"
          echo "Monitoring Enabled : ${{ matrix.enable-monitoring }}"
          echo "=========================================================="
